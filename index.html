<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reality Training - Micro Learning</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1413">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reality Training">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ===== WHITE LABEL COLORS — Reality Training dark theme ===== */
  :root {
    --bg: #0A1413; --surface: #0F1F1E; --surface-2: #163331; --ink: #EEF6F5;
    --ink-soft: #9FC2C0; --ink-muted: #5E8381; --accent: #54A6A7; --accent-2: #3D8485;
    --accent-text: #7FCFD0; --accent-soft: rgba(84,166,167,0.14); --good-bg: rgba(84,166,167,0.14);
    --good-text: #7FCFD0; --bad-bg: rgba(220,80,60,0.14); --bad-text: #FF6B57; --red: #FF6B57;
    --line: #1E3937; --gold: #FBBF24; --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); height: 100%; }
  #app-shell { max-width: 420px; margin: 24px auto; background: var(--surface); border-radius: 28px; border: 1px solid var(--line); height: calc(100dvh - 48px); display: flex; flex-direction: column; overflow: hidden; }
  .tab-screen-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  @media (max-width: 480px) {
    #app-shell { margin: 0 auto; height: 100dvh; border-radius: 0; border: none; max-width: 100%; padding-top: env(safe-area-inset-top); }
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; }
  .topbar .icon-btn { font-size: 20px; color: var(--ink-soft); cursor: pointer; width: 24px; text-align: center; background: none; border: none; }
  .topbar .label { font-size: 13px; color: var(--ink-muted); }
  .pill { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .pill-streak { background: rgba(251,191,36,0.12); color: var(--gold); }
  .pill-xp { background: var(--accent-soft); color: var(--accent-text); }
  .mode-link { font-size: 11px; color: var(--ink-muted); text-decoration: underline; cursor: pointer; background: none; border: none; }
  .screen { padding: 4px 20px 20px; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .eyebrow { font-size: 12px; color: var(--accent-text); font-weight: 700; margin: 0 0 4px; letter-spacing: 0.03em; text-transform: uppercase; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  h2 { font-size: 16px; margin: 0 0 10px; font-weight: 700; }
  .subtitle { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 14px; }
  .hero-card { background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; color: #06211F; cursor: pointer; }
  .hero-card .hicon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 10px; }
  .hero-card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
  .hero-card .meta { font-size: 12px; opacity: 0.85; display: flex; gap: 12px; }
  .card { background: var(--surface-2); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .card-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent-text); margin-bottom: 8px; justify-content: space-between; }
  .card p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink); }
  .option-btn { width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .option-btn.correct { background: var(--good-bg); border-color: var(--good-text); color: var(--good-text); }
  .option-btn.incorrect { background: var(--bad-bg); border-color: var(--bad-text); color: var(--bad-text); }
  .option-btn:disabled { cursor: default; }
  .primary-btn { width: 100%; padding: 14px; background: var(--accent); color: #06211F; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: auto; }
  .primary-btn:disabled { background: var(--surface-2); color: var(--ink-muted); cursor: not-allowed; }
  .secondary-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 12px; font-size: 13px; cursor: pointer; margin-top: 10px; }
  .mission-card { background: var(--accent-soft); border: 1px solid rgba(45,212,191,0.35); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .mission-card textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); padding: 10px 12px; font-size: 13px; font-family: inherit; margin-top: 10px; resize: vertical; min-height: 60px; }
  .course-card { display: flex; gap: 14px; align-items: center; padding: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; cursor: pointer; }
  .course-card .icon-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .course-card .title { font-size: 14.5px; font-weight: 700; margin: 0 0 4px; }
  .course-card .sub { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .mini-track { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .mini-fill { height: 100%; background: var(--accent); }
  .level-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .level-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .level-track { height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden; }
  .level-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .tabbar { display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0; border-top: 1px solid var(--line); background: var(--surface); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-muted); cursor: pointer; font-size: 9.5px; }
  .tab.active { color: var(--accent-text); }
  .tab .glyph { font-size: 18px; }
  .journey-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; margin-bottom: 8px; }
  .journey-row.done { background: var(--accent-soft); }
  .journey-row.current { background: var(--surface-2); border: 1.5px solid var(--accent); }
  .journey-row.locked { opacity: 0.45; }
  .journey-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: var(--surface); }
  .journey-row.done .journey-dot, .journey-row.current .journey-dot { background: var(--accent); color: #06211F; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0 14px; }
  .cal-cell { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; background: var(--surface); color: var(--ink-muted); }
  .cal-cell.lesson { background: rgba(45,212,191,0.18); color: var(--accent-text); font-weight: 700; }
  .cal-cell.today { border: 1.5px solid var(--accent); }
  .cal-head { font-size: 10px; color: var(--ink-muted); text-align: center; }
  .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge-tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: center; }
  .badge-tile.locked { opacity: 0.35; }
  .badge-tile .bicon { font-size: 24px; margin-bottom: 6px; }
  .badge-tile .bname { font-size: 12px; font-weight: 700; margin: 0 0 2px; }
  .badge-tile .bdesc { font-size: 10.5px; color: var(--ink-soft); margin: 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .stat-tile .slabel { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 4px; }
  .stat-tile .sval { font-size: 20px; font-weight: 700; margin: 0; }
  .lb-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .lb-toggle button { flex: 1; padding: 9px; font-size: 12.5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink-soft); cursor: pointer; }
  .lb-toggle button.active { background: var(--accent); color: #06211F; border-color: var(--accent); font-weight: 700; }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
  .lb-row.me { background: var(--accent-soft); border-color: var(--accent); }
  .lb-rank { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lb-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-2); color: #06211F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .lb-name { font-size: 13px; font-weight: 700; margin: 0; }
  .lb-sub { font-size: 11px; color: var(--ink-soft); margin: 0; }
  .lb-score { font-size: 13px; font-weight: 700; color: var(--accent-text); }
  .center-text { text-align: center; }
  .empty { color: var(--ink-muted); font-size: 13px; text-align: center; padding: 30px 0; }
  .login-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
  .login-wrap input { width: 100%; padding: 14px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 12px; font-size: 15px; margin-bottom: 12px; }
  .status-text { font-size: 13px; color: var(--ink-soft); text-align: center; margin-top: 12px; }
  .install-full-btn { width: 100%; background: var(--surface-2); color: var(--accent-text); border: 1px solid var(--accent); border-radius: 12px; padding: 11px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .compose-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
  .compose-card input { flex: 1; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .compose-card button { background: none; border: none; color: var(--accent-text); font-weight: 700; font-size: 13px; cursor: pointer; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
  .filter-chip { white-space: nowrap; padding: 7px 14px; border-radius: 20px; font-size: 12px; background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); cursor: pointer; }
  .filter-chip.active { background: var(--accent); color: #06211F; border-color: var(--accent); font-weight: 700; }
  .post-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .post-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .post-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-2); color: #06211F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .post-name { font-size: 12.5px; font-weight: 700; }
  .post-text { font-size: 13.5px; line-height: 1.5; margin: 0 0 8px; }
  .like-btn { background: none; border: none; color: var(--ink-soft); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
</style>
</head>

function achievementEarned(a) {
  if (a.rule_type === "streak") return state.streak >= a.rule_value;
  if (a.rule_type === "mission_count") return Object.values(state.progressMap).filter(m => m.mission_done).length >= a.rule_value;
  if (a.rule_type === "quiz_count") return Object.values(state.progressMap).filter(m => m.selected_index !== undefined && m.selected_index !== null).length >= a.rule_value;
  if (a.rule_type === "course_complete") {
    const c = state.courses[a.rule_course_id];
    return !!(c && c.modules.length > 0 && c.modules.every(m => state.progressMap[m.id] && state.progressMap[m.id].mission_done));
  }
  if (a.rule_type === "discussion_count") return (state.myDiscussionCount || 0) >= a.rule_value;
  return false;
}
async function loadAchievements() {
  const { data } = await sb.from("achievements").select("*").order("created_at");
  state.achievements = data || [];
}
async function loadMyDiscussionCount() {
  const { count } = await sb.from("discussion_posts").select("id", { count: "exact", head: true }).eq("user_id", state.user.id);
  state.myDiscussionCount = count || 0;
}

let state = {
  screen: "loading", user: null, courses: {}, progressMap: {}, streak: 0, longestStreak: 0,
  courseId: null, moduleIndex: 0, answered: false, selected: null, missionText: "",
  leaderboard: [], loginStatus: "", activeTab: "home", loginStep: "email", pendingEmail: "",
  feedPosts: [], feedFilter: "all", feedDraft: "", lbMode: "individuals", lbCourseFilter: "overall",
  achievements: [], myDiscussionCount: 0, discussionPosts: [], discussionDraft: "", replyDraft: {}, replyOpenFor: null
};
let alreadyLoaded = false;

async function init() {
  state.screen = "loading"; render();
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      state.user = session.user;
      if (!alreadyLoaded || event === "SIGNED_IN") { alreadyLoaded = true; await loadEverything(); }
    } else if (event !== "INITIAL_SESSION") {
      state.screen = "login"; state.user = null; alreadyLoaded = false; render();
    }
  });
  setTimeout(() => { if (state.screen === "loading" && !alreadyLoaded) { state.screen = "login"; render(); } }, 2500);
}

async function loadEverything() {
  state.screen = "loading"; render();
  await sb.from("profiles").upsert({ id: state.user.id, email: state.user.email }, { onConflict: "id", ignoreDuplicates: false });
  const { data: courseRows } = await sb.from("courses").select("*").order("sort_order");
  const { data: moduleRows } = await sb.from("modules").select("*").order("sort_order");
  const courses = {};
  (courseRows || []).forEach(c => { courses[c.id] = { title: c.title, icon: c.icon, modules: [] }; });
  (moduleRows || []).forEach(m => {
    if (courses[m.course_id]) {
      courses[m.course_id].modules.push({ id: m.id, title: m.title, read: m.read_content, readTime: m.read_time, tip: m.tip,
        quiz: { question: m.quiz_question, options: m.quiz_options, correct: m.quiz_correct_index,
          type: m.question_type || "multiple_choice", correctIndices: m.quiz_correct_indices, pairs: m.match_pairs } });
    }
  });
  state.courses = courses;
  const { data: progressRows } = await sb.from("module_progress").select("*").eq("user_id", state.user.id);
  const progressMap = {};
  (progressRows || []).forEach(r => { progressMap[r.module_id] = r; });
  state.progressMap = progressMap;
  const { data: streakRow } = await sb.from("streaks").select("*").eq("user_id", state.user.id).maybeSingle();
  state.streak = streakRow ? streakRow.current_streak : 0;
  state.longestStreak = streakRow ? streakRow.longest_streak : 0;

  const { data: myMemberships } = await sb.from("group_members").select("group_id").eq("user_id", state.user.id);
  state.userGroupIds = (myMemberships || []).map(m => m.group_id);
  const { data: assignmentRows } = await sb.from("assignments").select("*");
  state.assignments = assignmentRows || [];

  state.screen = "home"; state.activeTab = "home"; render();
}

// Returns null if nothing has been assigned yet system-wide (show everything, back-compat),
// otherwise a Set of course_ids actually assigned to this learner (directly or via a group).
function getAssignedCourseIds() {
  if (!state.assignments || state.assignments.length === 0) return null;
  const ids = new Set();
  state.assignments.forEach(a => {
    if (a.user_id === state.user.id) ids.add(a.course_id);
    else if (a.group_id && state.userGroupIds.includes(a.group_id)) ids.add(a.course_id);
  });
  return ids;
}
function visibleFlatModules() {
  const assignedIds = getAssignedCourseIds();
  const flat = flatModules();
  return assignedIds === null ? flat : flat.filter(m => assignedIds.has(m.courseId));
}
function visibleCourseIds() {
  const assignedIds = getAssignedCourseIds();
  return assignedIds === null ? Object.keys(state.courses) : Object.keys(state.courses).filter(id => assignedIds.has(id));
}
// A module unlocks the calendar day after the one before it was completed, so a course
// can't be finished in one sitting. The first module in the sequence is always open.
function isModuleUnlocked(index, flat) {
  if (index <= 0) return true;
  const prev = flat[index - 1];
  const prevProgress = state.progressMap[prev.id];
  if (!prevProgress || !prevProgress.mission_done) return false;
  if (!prevProgress.mission_completed_at) return true; // older data with no timestamp, don't block on it
  const completedDate = prevProgress.mission_completed_at.slice(0, 10);
  const today = new Date().toISOString().slice(0, 10);
  return completedDate < today;
}

async function sendLoginCode(email) {
  state.loginStatus = "Sending code..."; render();
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
  if (error) { state.loginStatus = "Something went wrong, try again."; render(); return; }
  state.pendingEmail = email;
  state.loginStep = "code";
  state.loginStatus = "";
  render();
}
async function verifyLoginCode(code) {
  if (!code || code.trim().length < 4) { state.loginStatus = "Enter the code from your email."; render(); return; }
  state.loginStatus = "Checking..."; render();
  const { error } = await sb.auth.verifyOtp({ email: state.pendingEmail, token: code.trim(), type: "email" });
  if (error) { state.loginStatus = "That code didn't work, check it and try again, or request a new one."; render(); }
  // On success, onAuthStateChange picks up the session automatically.
}

async function saveQuizAnswer(moduleId, selectedIndex, correct) {
  await sb.from("module_progress").upsert({ user_id: state.user.id, module_id: moduleId, selected_index: selectedIndex, correct }, { onConflict: "user_id,module_id" });
  state.progressMap[moduleId] = { ...(state.progressMap[moduleId] || {}), selected_index: selectedIndex, correct };
  await updateStreak();
}
async function saveMission(moduleId, reflection) {
  const now = new Date().toISOString();
  await sb.from("module_progress").upsert({ user_id: state.user.id, module_id: moduleId, mission_done: true, mission_reflection: reflection, mission_completed_at: now }, { onConflict: "user_id,module_id" });
  state.progressMap[moduleId] = { ...(state.progressMap[moduleId] || {}), mission_done: true, mission_reflection: reflection, mission_completed_at: now };
}
async function updateStreak() {
  const today = new Date().toISOString().slice(0, 10);
  const { data: existing } = await sb.from("streaks").select("*").eq("user_id", state.user.id).maybeSingle();
  let newStreak = 1;
  if (existing && existing.last_active_date) {
    const last = existing.last_active_date;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (last === today) newStreak = existing.current_streak;
    else if (last === yesterday) newStreak = existing.current_streak + 1;
    else newStreak = 1;
  }
  const longest = existing ? Math.max(existing.longest_streak || 0, newStreak) : newStreak;
  await sb.from("streaks").upsert({ user_id: state.user.id, current_streak: newStreak, longest_streak: longest, last_active_date: today }, { onConflict: "user_id" });
  state.streak = newStreak; state.longestStreak = longest;
}
async function loadLeaderboard() {
  if (state.lbCourseFilter === "overall") {
    const { data } = await sb.from("leaderboard").select("*").order("modules_completed", { ascending: false });
    state.leaderboard = data || [];
  } else {
    const { data } = await sb.from("course_leaderboard").select("*").eq("course_id", state.lbCourseFilter).order("modules_completed", { ascending: false });
    state.leaderboard = data || [];
  }
}
async function loadFeed() {
  const { data } = await sb.from("feed_posts").select("*, profiles(full_name, email)").order("created_at", { ascending: false });
  state.feedPosts = data || [];
}
async function postToFeed(content) {
  if (!content.trim()) return;
  await sb.from("feed_posts").insert({ user_id: state.user.id, content: content.trim(), course_id: state.courseId || null });
  state.feedDraft = "";
  await loadFeed(); render();
}
async function likePost(post) {
  await sb.from("feed_posts").update({ likes_count: (post.likes_count || 0) + 1 }).eq("id", post.id);
  post.likes_count = (post.likes_count || 0) + 1; render();
}

function computeXP() {
  let xp = 0;
  Object.values(state.progressMap).forEach(m => { if (m.selected_index !== undefined && m.selected_index !== null) xp += 100; if (m.mission_done) xp += 50; });
  return xp;
}
function levelInfo(xp) {
  let current = LEVEL_TIERS[0], next = LEVEL_TIERS[1];
  for (let i = 0; i < LEVEL_TIERS.length; i++) { if (xp >= LEVEL_TIERS[i].min) { current = LEVEL_TIERS[i]; next = LEVEL_TIERS[i + 1] || null; } }
  return { name: current.name, next: next, progress: next ? (xp - current.min) / (next.min - current.min) : 1, xpToNext: next ? next.min - xp : 0 };
}
function totalModuleCount() { return Object.values(state.courses).reduce((sum, c) => sum + c.modules.length, 0); }
function flatModules() {
  const flat = [];
  Object.keys(state.courses).forEach(cid => { state.courses[cid].modules.forEach(m => flat.push({ ...m, courseId: cid, courseTitle: state.courses[cid].title })); });
  return flat;
}
function findNextModule() {
  const flat = visibleFlatModules();
  return flat.find(m => !state.progressMap[m.id] || !state.progressMap[m.id].mission_done) || null;
}

function render() {
  const el = document.getElementById("app-shell");
  el.innerHTML = "";
  if (state.screen === "loading") { el.appendChild(renderLoading()); return; }
  if (state.screen === "login") { el.appendChild(renderLogin()); return; }
  if (state.screen === "concept" || state.screen === "quiz" || state.screen === "mission") { el.appendChild(renderLesson()); return; }
  if (state.screen === "discussion") { el.appendChild(renderDiscussion()); return; }
  if (state.activeTab === "home") el.appendChild(renderHome());
  else if (state.activeTab === "feed") el.appendChild(renderFeed());
  else if (state.activeTab === "journey") el.appendChild(renderJourney());
  else if (state.activeTab === "badges") el.appendChild(renderBadges());
  else if (state.activeTab === "ranks") el.appendChild(renderRanks());
  else if (state.activeTab === "saved") el.appendChild(renderSaved());
  el.appendChild(renderTabbar());
}

function renderJourney() {
  const wrap = document.createElement("div"); wrap.className = "tab-screen-wrap"; wrap.appendChild(topStats());
  const screen = document.createElement("div"); screen.className = "screen";
  screen.innerHTML = `<h1>Your Journey</h1><p class="subtitle">${visibleFlatModules().length}-day microlearning programme</p>`;

  const flat = visibleFlatModules();
  const dayHeads = ["M","T","W","T","F","S","S"];
  const cal = document.createElement("div"); cal.className = "cal-grid";
  dayHeads.forEach(d => { const h = document.createElement("div"); h.className = "cal-head"; h.textContent = d; cal.appendChild(h); });
  let doneSoFar = 0;
  flat.forEach((m) => { if (state.progressMap[m.id] && state.progressMap[m.id].mission_done) doneSoFar++; });
  for (let i = 0; i < flat.length && i < 14; i++) {
    const cell = document.createElement("div");
    const isDone = state.progressMap[flat[i].id] && state.progressMap[flat[i].id].mission_done;
    const isCurrent = !isDone && i === doneSoFar;
    cell.className = "cal-cell lesson" + (isCurrent ? " today" : "");
    cell.innerHTML = isDone ? "✓" : `Day ${i + 1}`;
    cal.appendChild(cell);
  }
  screen.appendChild(cal);

  let reachedCurrent = false;
  flat.forEach((m, i) => {
    const progress = state.progressMap[m.id];
    const isDone = progress && progress.mission_done;
    const isNext = !isDone && !reachedCurrent;
    if (isNext) reachedCurrent = true;
    const unlocked = isNext && isModuleUnlocked(i, flat);
    const row = document.createElement("div");
    row.className = "journey-row " + (isDone ? "done" : unlocked ? "current" : "locked");
    if (unlocked) row.onclick = () => openModule(m.courseId, m);
    const subline = isDone ? `&#9200; ${m.readTime || ""} &nbsp; ⚡ +150 XP`
      : isNext && !unlocked ? "🔒 Unlocks tomorrow"
      : `&#9200; ${m.readTime || ""} &nbsp; ⚡ +150 XP`;
    row.innerHTML = `<div class="journey-dot">${isDone ? "✓" : i + 1}</div><div style="flex:1;"><p style="font-size:14px; font-weight:700; margin:0 0 2px;">${m.title}</p><p style="font-size:11px; color:var(--ink-soft); margin:0;">${subline}</p></div>`;
    screen.appendChild(row);
  });
  wrap.appendChild(screen); return wrap;
}

  if (state.screen === "concept") {
    const hero = document.createElement("div"); hero.className = "hero-card"; hero.style.cursor = "default";
    hero.innerHTML = `<div class="hicon">⚡</div><h3>${mod.title}</h3><div class="meta"><span>&#9200; ${mod.readTime || ""}</span><span>+100 XP</span></div>`;
    screen.appendChild(hero);
    const isSaved = state.progressMap[mod.id] && state.progressMap[mod.id].saved;
    const saveBtn = document.createElement("button"); saveBtn.className = "secondary-btn"; saveBtn.style.marginTop = "0"; saveBtn.style.marginBottom = "12px";
    saveBtn.textContent = isSaved ? "🔖 Saved, tap to remove" : "🔖 Save for later";
    saveBtn.onclick = () => toggleSaved(mod.id);
    screen.appendChild(saveBtn);
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="card-label">🧠 Concept</div><p>${mod.read}</p>`;
    screen.appendChild(card);
    const btn = document.createElement("button"); btn.className = "primary-btn"; btn.textContent = "Start Pulse Check";
    btn.onclick = () => { state.screen = "quiz"; render(); };
    screen.appendChild(btn);
  } else if (state.screen === "quiz") {
    const qlabel = document.createElement("p"); qlabel.className = "eyebrow"; qlabel.style.marginBottom = "10px"; qlabel.textContent = "Pulse check"; screen.appendChild(qlabel);
    const qtext = document.createElement("p"); qtext.style.cssText = "font-size:15px;font-weight:600;margin:0 0 14px;"; qtext.textContent = mod.quiz.question; screen.appendChild(qtext);
    const qtype = mod.quiz.type || "multiple_choice";
    if (qtype === "multi_select") renderMultiSelectQuiz(screen, mod);
    else if (qtype === "match") renderMatchQuiz(screen, mod);
    else renderSingleAnswerQuiz(screen, mod); // covers multiple_choice and true_false
  } else if (state.screen === "mission") {
    const existing = state.progressMap[mod.id];
    const missionDone = existing && existing.mission_done;
    const mission = document.createElement("div"); mission.className = "mission-card";
    mission.innerHTML = `<div class="card-label"><span>🎯 Real-world mission</span><span>+50 XP</span></div><p>${mod.tip}</p>`;
    const textarea = document.createElement("textarea"); textarea.placeholder = "How did it go?";
    textarea.value = existing && existing.mission_reflection ? existing.mission_reflection : "";
    textarea.disabled = !!missionDone;
    textarea.oninput = e => { state.missionText = e.target.value; };
    mission.appendChild(textarea); screen.appendChild(mission);
    const isLast = dayNum === flat.length;
    const btn = document.createElement("button"); btn.className = "primary-btn";
    btn.textContent = missionDone ? (isLast ? "Finish" : "Next Pulse →") : "Submit mission";
    btn.onclick = async () => {
      if (!missionDone) { await saveMission(mod.id, state.missionText || textarea.value); render(); return; }
      if (isLast) { state.screen = "complete"; render(); return; }
      const next = flat[dayNum]; openModule(next.courseId, next);
    };
    screen.appendChild(btn);
    const discussBtn = document.createElement("button"); discussBtn.className = "secondary-btn"; discussBtn.textContent = "💬 Discuss this lesson";
    discussBtn.onclick = () => { state.discussionModuleId = mod.id; state.discussionCourseId = state.courseId; state.discussionModTitle = mod.title; state.screen = "discussion"; render(); };
    screen.appendChild(discussBtn);
    const skip = document.createElement("button"); skip.className = "secondary-btn"; skip.textContent = "Back to dashboard";
    skip.onclick = () => { state.screen = "home"; render(); };
    screen.appendChild(skip);
  }
  wrap.appendChild(screen); return wrap;
}

function renderSingleAnswerQuiz(screen, mod) {
  const options = mod.quiz.options && mod.quiz.options.length ? mod.quiz.options : (mod.quiz.type === "true_false" ? ["True", "False"] : []);
  const existing = state.progressMap[mod.id];
  const previouslyCompleted = existing && existing.selected_index !== undefined && existing.selected_index !== null;
  const alreadyAnswered = state.answered;
  const selectedIdx = state.selected;
  if (previouslyCompleted && !state.answered) {
    const note = document.createElement("p"); note.className = "subtitle"; note.style.marginBottom = "8px";
    note.textContent = "You've completed this before, feel free to retake it.";
    screen.appendChild(note);
  }
  options.forEach((opt, i) => {
    const btn = document.createElement("button"); btn.className = "option-btn"; btn.textContent = opt;
    if (alreadyAnswered) { btn.disabled = true; if (i === mod.quiz.correct) btn.classList.add("correct"); else if (i === selectedIdx) btn.classList.add("incorrect"); }
    btn.onclick = async () => { state.selected = i; state.answered = true; render(); await saveQuizAnswer(mod.id, i, i === mod.quiz.correct); };
    screen.appendChild(btn);
  });
  const cont = document.createElement("button"); cont.className = "primary-btn"; cont.textContent = "Continue to mission"; cont.disabled = !alreadyAnswered;
  cont.onclick = () => { state.screen = "mission"; render(); };
  screen.appendChild(cont);
}

function renderMultiSelectQuiz(screen, mod) {
  const options = mod.quiz.options || [];
  const correctSet = new Set(mod.quiz.correctIndices || []);
  const existing = state.progressMap[mod.id];
  const previouslyCompleted = existing && existing.selected_index !== undefined && existing.selected_index !== null;
  const alreadyAnswered = state.answered;
  if (!state.multiSelectChoices || state._multiSelectModId !== mod.id) {
    state._multiSelectModId = mod.id;
    state.multiSelectChoices = options.map(() => false);
  }
  if (previouslyCompleted && !state.answered) {
    const note = document.createElement("p"); note.className = "subtitle"; note.style.marginBottom = "8px";
    note.textContent = "You've completed this before, feel free to retake it.";
    screen.appendChild(note);
  }
  const hint = document.createElement("p"); hint.className = "subtitle"; hint.style.marginBottom = "6px"; hint.textContent = "Select all that apply";
  screen.appendChild(hint);
  options.forEach((opt, i) => {
    const btn = document.createElement("button"); btn.className = "option-btn"; btn.textContent = (state.multiSelectChoices[i] ? "☑ " : "☐ ") + opt;
    if (alreadyAnswered) { btn.disabled = true; if (correctSet.has(i)) btn.classList.add("correct"); else if (state.multiSelectChoices[i]) btn.classList.add("incorrect"); }
    else { btn.onclick = () => { state.multiSelectChoices[i] = !state.multiSelectChoices[i]; render(); }; }
    screen.appendChild(btn);
  });
  if (!alreadyAnswered) {
    const submit = document.createElement("button"); submit.className = "primary-btn"; submit.textContent = "Submit answer";
    submit.onclick = async () => {
      const mask = state.multiSelectChoices.reduce((m, checked, i) => checked ? (m | (1 << i)) : m, 0);
      const correctMask = (mod.quiz.correctIndices || []).reduce((m, i) => m | (1 << i), 0);
      state.answered = true; state.selected = mask; render();
      await saveQuizAnswer(mod.id, mask, mask === correctMask);
    };
    screen.appendChild(submit);
  } else {
    const cont = document.createElement("button"); cont.className = "primary-btn"; cont.textContent = "Continue to mission";
    cont.onclick = () => { state.screen = "mission"; render(); };
    screen.appendChild(cont);
  }
}

function renderMatchQuiz(screen, mod) {
  const pairs = mod.quiz.pairs || [];
  const existing = state.progressMap[mod.id];
  const previouslyCompleted = existing && existing.correct !== undefined && existing.correct !== null && existing.selected_index !== undefined;
  const alreadyAnswered = state.answered;
  if (!state._matchModId || state._matchModId !== mod.id) {
    state._matchModId = mod.id;
    state._matchRight = pairs.map((p, i) => ({ text: p.right, originalIndex: i })).sort(() => Math.random() - 0.5);
    state._matchSelectedLeft = null;
    state._matchMatched = {}; // leftIndex -> true if correctly matched
    state._matchWrongFlash = null;
  }
  if (previouslyCompleted && !state.answered) {
    const note = document.createElement("p"); note.className = "subtitle"; note.style.marginBottom = "8px";
    note.textContent = "You've completed this before, feel free to retake it.";
    screen.appendChild(note);
  }
  const hint = document.createElement("p"); hint.className = "subtitle"; hint.style.marginBottom = "10px"; hint.textContent = "Tap a term, then tap its match";
  screen.appendChild(hint);
  const row = document.createElement("div"); row.style.cssText = "display:flex; gap:10px;";
  const leftCol = document.createElement("div"); leftCol.style.cssText = "flex:1; display:flex; flex-direction:column; gap:8px;";
  const rightCol = document.createElement("div"); rightCol.style.cssText = "flex:1; display:flex; flex-direction:column; gap:8px;";
  pairs.forEach((p, i) => {
    const btn = document.createElement("button"); btn.className = "option-btn"; btn.textContent = p.left; btn.style.fontSize = "12.5px";
    if (state._matchMatched[i]) btn.classList.add("correct");
    if (state._matchSelectedLeft === i) btn.style.borderColor = "var(--accent)";
    btn.disabled = !!state._matchMatched[i] || alreadyAnswered;
    btn.onclick = () => { state._matchSelectedLeft = i; render(); };
    leftCol.appendChild(btn);
  });
  state._matchRight.forEach(r => {
    const btn = document.createElement("button"); btn.className = "option-btn"; btn.textContent = r.text; btn.style.fontSize = "12.5px";
    const isMatched = state._matchMatched[r.originalIndex];
    if (isMatched) btn.classList.add("correct");
    btn.disabled = isMatched || alreadyAnswered;
    btn.onclick = async () => {
      if (state._matchSelectedLeft === null) return;
      if (state._matchSelectedLeft === r.originalIndex) {
        state._matchMatched[r.originalIndex] = true; state._matchSelectedLeft = null; render();
        if (Object.keys(state._matchMatched).length === pairs.length) {
          state.answered = true; render();
          await saveQuizAnswer(mod.id, 1, true);
        }
      } else {
        state._matchWrongFlash = r.originalIndex; render();
        setTimeout(() => { state._matchWrongFlash = null; state._matchSelectedLeft = null; render(); }, 500);
      }
    };
    if (state._matchWrongFlash === r.originalIndex) btn.classList.add("incorrect");
    rightCol.appendChild(btn);
  });
  row.appendChild(leftCol); row.appendChild(rightCol);
  screen.appendChild(row);
  const doneMatching = Object.keys(state._matchMatched).length === pairs.length;
  const cont = document.createElement("button"); cont.className = "primary-btn"; cont.style.marginTop = "16px"; cont.textContent = "Continue to mission";
  cont.disabled = !doneMatching;
  cont.onclick = () => { state.screen = "mission"; render(); };
  screen.appendChild(cont);
}


async function toggleSaved(moduleId) {
  const existing = state.progressMap[moduleId] || {};
  const newSaved = !existing.saved;
  await sb.from("module_progress").upsert({ user_id: state.user.id, module_id: moduleId, saved: newSaved }, { onConflict: "user_id,module_id" });
  state.progressMap[moduleId] = { ...existing, saved: newSaved };
  render();
}

function renderSaved() {
  const wrap = document.createElement("div"); wrap.className = "tab-screen-wrap"; wrap.appendChild(topStats());
  const screen = document.createElement("div"); screen.className = "screen";
  const back = document.createElement("button"); back.className = "mode-link"; back.style.marginBottom = "10px"; back.textContent = "← Back to home";
  back.onclick = () => { state.activeTab = "home"; render(); };
  screen.appendChild(back);
  screen.innerHTML += `<h1>Saved lessons</h1><p class="subtitle">Bookmarked for later</p>`;
  const flat = flatModules();
  const saved = flat.filter(m => state.progressMap[m.id] && state.progressMap[m.id].saved);
  if (saved.length === 0) { screen.innerHTML += '<p class="empty">Nothing saved yet. Tap the bookmark icon on any lesson to save it here.</p>'; }
  saved.forEach(m => {
    const row = document.createElement("div"); row.className = "journey-row";
    row.style.cursor = "pointer";
    row.onclick = () => openModule(m.courseId, m);
    row.innerHTML = `<div class="journey-dot">🔖</div><div style="flex:1;"><p style="font-size:14px; font-weight:700; margin:0 0 2px;">${m.title}</p><p style="font-size:11px; color:var(--ink-soft); margin:0;">${m.courseTitle}</p></div>`;
    screen.appendChild(row);
  });
  wrap.appendChild(screen); return wrap;
}

async function loadDiscussion(moduleId) {
  const { data } = await sb.from("discussion_posts").select("*, profiles(full_name, email)").eq("module_id", moduleId).order("created_at", { ascending: true });
  state.discussionPosts = data || [];
}
async function postDiscussion(moduleId, content, parentId) {
  if (!content || !content.trim()) return;
  await sb.from("discussion_posts").insert({ module_id: moduleId, user_id: state.user.id, content: content.trim(), parent_id: parentId || null });
  state.discussionDraft = ""; state.replyDraft = {}; state.replyOpenFor = null;
  await loadDiscussion(moduleId); render();
}
function renderDiscussion() {
  const wrap = document.createElement("div");
  const top = document.createElement("div"); top.className = "topbar";
  const back = document.createElement("button"); back.className = "icon-btn"; back.innerHTML = "&#8592;";
  back.onclick = () => { state.screen = "mission"; render(); };
  top.appendChild(back);
  const lab = document.createElement("span"); lab.className = "label"; lab.textContent = "Discussion";
  top.appendChild(lab); top.appendChild(document.createElement("span"));
  wrap.appendChild(top);
  const screen = document.createElement("div"); screen.className = "screen";
  const h = document.createElement("h1"); h.style.fontSize = "17px"; h.textContent = state.discussionModTitle || ""; screen.appendChild(h);
  const sub = document.createElement("p"); sub.className = "subtitle"; sub.textContent = "Share what worked, ask questions, compare notes"; screen.appendChild(sub);

  const compose = document.createElement("div"); compose.className = "compose-card";
  const input = document.createElement("input"); input.placeholder = "Add to the discussion...";
  input.oninput = e => { state.discussionDraft = e.target.value; };
  compose.appendChild(input);
  const postBtn = document.createElement("button"); postBtn.textContent = "POST";
  postBtn.onclick = () => postDiscussion(state.discussionModuleId, input.value, null);
  compose.appendChild(postBtn);
  screen.appendChild(compose);

  const listWrap = document.createElement("div"); listWrap.innerHTML = '<p class="empty">Loading...</p>';
  screen.appendChild(listWrap);
  loadDiscussion(state.discussionModuleId).then(() => {
    listWrap.innerHTML = "";
    const topLevel = state.discussionPosts.filter(p => !p.parent_id);
    if (topLevel.length === 0) { listWrap.innerHTML = '<p class="empty">No comments yet, start the conversation.</p>'; return; }
    topLevel.forEach(p => {
      const name = (p.profiles && (p.profiles.full_name || p.profiles.email.split("@")[0])) || "Learner";
      const isMe = p.user_id === state.user.id;
      const card = document.createElement("div"); card.className = "post-card";
      card.innerHTML = `<div class="post-head"><div class="post-avatar">${name.slice(0,2).toUpperCase()}</div><span class="post-name">${isMe ? "You" : name}</span></div><p class="post-text">${p.content}</p>`;
      const replies = state.discussionPosts.filter(r => r.parent_id === p.id);
      replies.forEach(r => {
        const rname = (r.profiles && (r.profiles.full_name || r.profiles.email.split("@")[0])) || "Learner";
        const rIsMe = r.user_id === state.user.id;
        const rBlock = document.createElement("div"); rBlock.className = "reply-block";
        rBlock.innerHTML = `<div class="post-head"><div class="post-avatar" style="width:20px;height:20px;font-size:9px;">${rname.slice(0,2).toUpperCase()}</div><span class="post-name" style="font-size:11.5px;">${rIsMe ? "You" : rname}</span></div><p class="post-text" style="font-size:12px;">${r.content}</p>`;
        card.appendChild(rBlock);
      });
      const replyLink = document.createElement("button"); replyLink.className = "reply-link"; replyLink.style.marginTop = "6px";
      replyLink.textContent = state.replyOpenFor === p.id ? "Cancel" : "Reply";
      replyLink.onclick = () => { state.replyOpenFor = state.replyOpenFor === p.id ? null : p.id; render(); };
      card.appendChild(replyLink);
      if (state.replyOpenFor === p.id) {
        const replyCompose = document.createElement("div"); replyCompose.className = "compose-card"; replyCompose.style.marginTop = "8px"; replyCompose.style.marginBottom = "0";
        const rInput = document.createElement("input"); rInput.placeholder = "Write a reply...";
        replyCompose.appendChild(rInput);
        const rBtn = document.createElement("button"); rBtn.textContent = "POST";
        rBtn.onclick = () => postDiscussion(state.discussionModuleId, rInput.value, p.id);
        replyCompose.appendChild(rBtn);
        card.appendChild(replyCompose);
      }
      listWrap.appendChild(card);
    });
  });

  wrap.appendChild(screen); return wrap;
}


function renderTabbar() {
  const bar = document.createElement("div"); bar.className = "tabbar";
  const tabs = [
    { id: "home", glyph: "&#8962;", label: "Home" },
    { id: "feed", glyph: "&#10024;", label: "Feed" },
    { id: "journey", glyph: "&#128506;", label: "Journey" },
    { id: "badges", glyph: "&#127942;", label: "Badges" },
    { id: "ranks", glyph: "&#128202;", label: "Ranks" }
  ];
  tabs.forEach(t => {
    const el = document.createElement("div"); el.className = "tab" + (state.activeTab === t.id ? " active" : "");
    el.innerHTML = `<span class="glyph">${t.glyph}</span><span>${t.label}</span>`;
    el.onclick = () => { state.activeTab = t.id; state.screen = t.id; render(); };
    bar.appendChild(el);
  });
  return bar;
}

init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
